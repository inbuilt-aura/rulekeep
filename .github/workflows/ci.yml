name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

      # The plugin is what users actually install, so its manifest is
      # validated by Claude Code's own validator, not just by our tests.
      - name: Validate the Claude Code plugin
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npx --yes @anthropic-ai/claude-code plugin validate ./plugins/claude-code --strict

      # The committed bundle must match the current source, or an installed
      # plugin silently runs old code.
      - name: Check the committed plugin bundle is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: git diff --exit-code -- plugins/claude-code/dist/
